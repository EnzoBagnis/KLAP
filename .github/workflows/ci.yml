name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: klap
  DB_USERNAME: klap_user
  DB_PASSWORD: klap_ci

jobs:
  backend:
    name: Backend Laravel
    runs-on: ubuntu-latest

    # Même image que le docker-compose, pour valider la base réellement utilisée.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root_ci
          MARIADB_DATABASE: klap
          MARIADB_USER: klap_user
          MARIADB_PASSWORD: klap_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, zip, bcmath, gd, fileinfo, intl
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      # Style (Pint) et analyse statique (PHPStan) : une erreur bloque la fusion (#258).
      # On les lance une fois l'environnement prêt : PHPStan démarre l'application pour la lire.
      - name: Style du code
        run: composer style

      - name: Analyse statique
        run: composer analyse -- --no-progress

      - name: Appliquer les migrations et les seeders
        run: php artisan migrate --seed --no-interaction

      # Une migration non réversible bloquerait tout retour arrière en production.
      - name: Vérifier que les migrations sont réversibles
        run: |
          php artisan migrate:rollback --no-interaction
          php artisan migrate --no-interaction

      # Le mode par défaut d'un développeur : SQLite en mémoire, aucune base requise.
      # Les variables globales DB_* priment sur phpunit.xml, on les neutralise ici.
      - name: Tests sur SQLite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

      # Le groupe mariadb rassemble les tests des contraintes CHECK, ignorées par SQLite.
      - name: Tests contre MariaDB
        run: |
          php artisan test --filter=DatabaseConnectionTest
          php artisan test --group=mariadb

      - name: Audit des dépendances
        run: composer audit --no-interaction

  frontend:
    name: Frontend React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Même version majeure que l'image Docker du frontend.
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Analyse statique
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Même logique que composer audit côté backend : une faille publiée bloque la CI.
      - name: Audit des dépendances
        run: npm audit
