server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Routage côté client : toute URL inconnue renvoie l'application,
    # sinon un rechargement sur /projets donnerait une 404.
    # index.html n'est jamais gardé en cache : après un déploiement, une page
    # ancienne réclamerait des fichiers /assets/ qui n'existent plus (page blanche).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Fichiers produits par Vite : leur nom contient une empreinte, cache long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
