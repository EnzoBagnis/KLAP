services:
  db:
    image: mariadb:11
    restart: unless-stopped
    command: --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    # Pas d'env_file ici : Laravel lit backend/.env, monté avec le volume
    # ci-dessous. Injecter le fichier en variables d'environnement du conteneur
    # casserait le bloc <php> de phpunit.xml, qui ne peut pas remplacer une
    # vraie variable de processus : les tests tourneraient sur MariaDB.
    environment:
      DB_HOST: db
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data: